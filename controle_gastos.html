<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas - HP Terraplenagem</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
</head>
<body>
    <div class="container dashboard-container">
        <div class="header-painel">
            <h2>Gerenciamento de Despesas</h2>
            <a href="painel.html" class="btn-sair">Voltar ao Painel</a>
        </div>

        <div id="mensagem-sistema" style="display: none;" class="mensagem"></div>

        <div class="form-cadastro">
            <h3>Lançar Novo Gasto</h3>
            
            <div class="ia-box">
                <label for="input_rapido"><strong>💡 Preenchimento Rápido Simulado (IA):</strong></label>
                <div class="ia-input-group">
                    <input type="text" id="input_rapido" placeholder="Ex: Abasteci 250 reais na L200 no posto Shell">
                    <button type="button" id="btn-ia-fill" onclick="simularPreenchimentoIA()" class="btn-ia">Preencher</button>
                </div>
            </div>

            <form id="form-novo-gasto" autocomplete="off">
                <div class="form-grid">
                    <div>
                        <label for="maquina">Máquina / Veículo *</label>
                        <select id="maquina" name="maquina" required class="input-select">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Retroescavadeira">Retroescavadeira</option>
                            <option value="Escavadeira">Escavadeira</option>
                            <option value="Pá Carregadeira">Pá Carregadeira</option>
                            <option value="Caminhão Caçamba VW">Caminhão Caçamba VW</option>
                            <option value="Caminhão Caçamba FORD">Caminhão Caçamba FORD</option>
                            <option value="Caminhão Caçamba MBENZ">Caminhão Caçamba M.BENZ</option>
                            <option value="Caminhão Prancha">Caminhão Prancha</option>
                            <option value="Carro L200">Carro L200</option>
                            <option value="Carro Strada">Carro Strada</option>
                        </select>
                    </div>
                    <div>
                        <label for="gasto">Valor (Gasto) *</label>
                        <input type="text" id="gasto" name="gasto" placeholder="R$ 0,00" inputmode="numeric" required>
                    </div>
                    <div>
                        <label for="tipo_gasto">Tipo de Gasto *</label>
                        <select id="tipo_gasto" name="tipo_gasto" required class="input-select">
                            <option value="combustivel">Combustível</option>
                            <option value="equipamento">Equipamento/Manutenção</option>
                        </select>
                    </div>
                    <div>
                        <label for="data_personalizada">Data Referência (Opcional)</label>
                        <input type="date" id="data_personalizada" name="data_personalizada">
                    </div>
                </div>
                <div class="form-group">
                    <label for="descricao">Descrição Adicional (Opcional)</label>
                    <input type="text" id="descricao" name="descricao" placeholder="Detalhes do gasto, fornecedor, etc...">
                </div>
                <button type="submit" class="btn-salvar">Salvar Lançamento</button>
            </form>
        </div>

        <hr class="divisor">

        <form id="form-filtros" class="search-form">
            <div class="form-group">
                <label for="maquina_filtro">Veículo</label>
                <select id="maquina_filtro" name="maquina_filtro" class="input-select">
                    <option value="">Todas as Máquinas</option>
                    <option value="Retroescavadeira">Retroescavadeira</option>
                    <option value="Escavadeira">Escavadeira</option>
                    <option value="Pá Carregadeira">Pá Carregadeira</option>
                    <option value="Caminhão Caçamba VW">Caminhão Caçamba VW</option>
                    <option value="Caminhão Caçamba FORD">Caminhão Caçamba FORD</option>
                    <option value="Caminhão Caçamba MBENZ">Caminhão Caçamba M.BENZ</option>
                    <option value="Carro L200">Carro L200</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mes">Mês</label>
                <select id="mes" name="mes" class="input-select">
                    <!-- Gerado via JS para facilitar -->
                </select>
            </div>
            <div class="form-group">
                <label for="ano">Ano</label>
                <input id="ano" type="number" name="ano" value="2026" required>
            </div>
            <div class="form-group flex-expand">
                <label for="busca">Buscar</label>
                <input id="busca" type="text" name="busca" placeholder="Termo de busca...">
            </div>
            <button type="submit" class="btn-filtrar">Filtrar</button>
        </form>

        <div class="summary-cards">
            <div class="card card-combustivel">
                <h3>Combustível</h3>
                <div id="tot-combustivel" class="value">R$ 0,00</div>
            </div>
            <div class="card card-manutencao">
                <h3>Manutenção / Equipamentos</h3>
                <div id="tot-manutencao" class="value">R$ 0,00</div>
            </div>
            <div class="card card-total">
                <h3>Total Geral</h3>
                <div id="tot-geral" class="value">R$ 0,00</div>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Máquina</th>
                        <th>Tipo</th>
                        <th>Valor (R$)</th>
                        <th>Descrição</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-gastos">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Segurança: Bloqueia não-admins
        if (!sessionStorage.getItem('id_usuario') || sessionStorage.getItem('tipo_usuario') !== 'admin') {
            window.location.href = 'index.html';
        }

        // Preenche o select de meses
        const mesSelect = document.getElementById('mes');
        const mesAtual = new Date().getMonth() + 1;
        for (let i = 1; i <= 12; i++) {
            let m = String(i).padStart(2, '0');
            mesSelect.innerHTML += `<option value="${m}" ${i === mesAtual ? 'selected' : ''}>${m}</option>`;
        }

        // Banco de Dados Fictício de Gastos
        let despesasMock = [
            { id: 1, data: '2026-10-12', maquina: 'Retroescavadeira', tipo: 'combustivel', valor: 350.00, descricao: 'Posto Ipiranga' },
            { id: 2, data: '2026-10-15', maquina: 'Pá Carregadeira', tipo: 'equipamento', valor: 1200.00, descricao: 'Troca de pneus dianteiros' },
            { id: 3, data: '2026-10-18', maquina: 'Carro L200', tipo: 'combustivel', valor: 250.00, descricao: 'Posto Shell' }
        ];

        // Formatação de Moeda e Tabela
        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function renderizarTabela() {
            const mesFiltro = document.getElementById('mes').value;
            const anoFiltro = document.getElementById('ano').value;
            const maqFiltro = document.getElementById('maquina_filtro').value;
            const buscaFiltro = document.getElementById('busca').value.toLowerCase();

            const tbody = document.getElementById('tabela-gastos');
            tbody.innerHTML = '';

            let totCombustivel = 0, totEquip = 0, totGeral = 0;
            let achou = false;

            // Ordena do mais recente pro mais antigo
            const despesasOrdenadas = [...despesasMock].sort((a, b) => new Date(b.data) - new Date(a.data));

            despesasOrdenadas.forEach(gasto => {
                const dataObj = new Date(gasto.data + 'T00:00:00'); // Fuso horário fixo
                const gMes = String(dataObj.getMonth() + 1).padStart(2, '0');
                const gAno = String(dataObj.getFullYear());

                const passaData = (gMes === mesFiltro && gAno === anoFiltro);
                const passaMaq = (maqFiltro === "" || gasto.maquina === maqFiltro);
                const passaBusca = (buscaFiltro === "" || gasto.descricao.toLowerCase().includes(buscaFiltro) || gasto.maquina.toLowerCase().includes(buscaFiltro));

                if (passaData && passaMaq && passaBusca) {
                    achou = true;
                    totGeral += gasto.valor;
                    if (gasto.tipo === 'combustivel') totCombustivel += gasto.valor;
                    else totEquip += gasto.valor;

                    const dataFormatada = `${String(dataObj.getDate()).padStart(2, '0')}/${gMes}/${gAno}`;
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${dataFormatada}</td>
                            <td>${gasto.maquina}</td>
                            <td><span class="badge badge-${gasto.tipo}">${gasto.tipo}</span></td>
                            <td><strong>R$ ${formatarMoeda(gasto.valor)}</strong></td>
                            <td>${gasto.descricao}</td>
                            <td><button type="button" class="btn-editar" onclick="alert('Função de edição bloqueada na versão Demo.')">Editar</button></td>
                        </tr>
                    `;
                }
            });

            if (!achou) tbody.innerHTML = `<tr><td colspan="6" class="text-center">Nenhuma despesa encontrada neste período.</td></tr>`;

            // Atualiza os Cards
            document.getElementById('tot-combustivel').textContent = 'R$ ' + formatarMoeda(totCombustivel);
            document.getElementById('tot-manutencao').textContent = 'R$ ' + formatarMoeda(totEquip);
            document.getElementById('tot-geral').textContent = 'R$ ' + formatarMoeda(totGeral);
        }

        // Lançar Novo Gasto
        document.getElementById('form-novo-gasto').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const maquina = document.getElementById('maquina').value;
            const tipo = document.getElementById('tipo_gasto').value;
            const descricao = document.getElementById('descricao').value;
            const dataInput = document.getElementById('data_personalizada').value || new Date().toISOString().split('T')[0];
            
            // Limpa o R$ e converte para float
            const gastoBruto = document.getElementById('gasto').value;
            const valorFloat = parseFloat(gastoBruto.replace('R$ ', '').replace(/\./g, '').replace(',', '.'));

            if (!maquina || isNaN(valorFloat)) return;

            // Adiciona no Mock
            despesasMock.push({
                id: Date.now(),
                data: dataInput,
                maquina: maquina,
                tipo: tipo,
                valor: valorFloat,
                descricao: descricao
            });

            // Mostra sucesso
            const msgBox = document.getElementById('mensagem-sistema');
            msgBox.textContent = "Gasto registrado com sucesso!";
            msgBox.className = "mensagem sucesso";
            msgBox.style.display = "block";
            setTimeout(() => msgBox.style.display = 'none', 4000);

            // Limpa form e recarrega
            document.getElementById('form-novo-gasto').reset();
            renderizarTabela();
        });

        // Filtrar
        document.getElementById('form-filtros').addEventListener('submit', function(e) {
            e.preventDefault();
            renderizarTabela();
        });

        // Máscara de Moeda (Idêntica ao PHP original)
        const inputElement = document.getElementById('gasto');
        inputElement.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, "");
            value = (value / 100).toFixed(2) + '';
            value = value.replace(".", ",");
            value = value.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            e.target.value = value !== "0,00" ? "R$ " + value : "";
        });

        // Simulador de IA (Efeito visual para portfólio)
        function simularPreenchimentoIA() {
            const texto = document.getElementById('input_rapido').value.toLowerCase();
            if(!texto) return alert('Digite um gasto primeiro! Ex: Abasteci 250 na L200 no posto shell');

            const btn = document.getElementById('btn-ia-fill');
            btn.innerHTML = 'Processando...';
            btn.disabled = true;

            setTimeout(() => {
                // Lógica simples de palavras-chave
                if (texto.includes('l200')) document.getElementById('maquina').value = 'Carro L200';
                if (texto.includes('retro')) document.getElementById('maquina').value = 'Retroescavadeira';
                
                if (texto.includes('abastec') || texto.includes('posto')) document.getElementById('tipo_gasto').value = 'combustivel';
                if (texto.includes('pneu') || texto.includes('peça')) document.getElementById('tipo_gasto').value = 'equipamento';

                // Extrai número
                const numeros = texto.match(/\d+/);
                if (numeros) {
                    const valorFormatado = parseFloat(numeros[0]).toFixed(2).replace('.', ',');
                    document.getElementById('gasto').value = 'R$ ' + valorFormatado;
                }

                // Coloca o resto na descrição
                document.getElementById('descricao').value = 'Preenchido via simulação IA: ' + texto;

                btn.innerHTML = 'Preencher';
                btn.disabled = false;
            }, 1000); // delay para fingir que tá pensando
        }

        // Carrega tabela inicial
        renderizarTabela();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(console.error);
        }
        <script src="chat.js"></script>
    </script>
</body>
</html>
