<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário - HP Terraplenagem</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
</head>
<body>
    <div class="container form-card">
        <a href="painel.html" class="link-voltar">&larr; Voltar ao Painel</a>
        
        <h2>Novo Usuário</h2>

        <div id="mensagem-sistema" style="display: none;" class="mensagem"></div>

        <form id="form-cadastro" autocomplete="off">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: João da Silva" required>
            </div>

            <div class="form-group">
                <label for="login">Login de Acesso:</label>
                <input type="text" id="login" name="login" placeholder="Ex: joao.silva" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha de acesso" required>
            </div>

            <div class="form-group">
                <label for="tipo">Nível de Acesso:</label>
                <select id="tipo" name="tipo" class="input-select">
                    <option value="operador">Operador</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <button type="submit" class="btn-salvar">Cadastrar Usuário</button>
        </form>
    </div>

<script>
    // 1. Bloqueia quem não for administrador (Segurança mockada)
    if (!sessionStorage.getItem('id_usuario') || sessionStorage.getItem('tipo_usuario') !== 'admin') {
        alert("Acesso restrito a administradores.");
        window.location.href = 'index.html';
    }

    // 2. Simulação de Cadastro
    document.getElementById('form-cadastro').addEventListener('submit', function(e) {
        e.preventDefault(); // Evita recarregar a página
        
        const nome = document.getElementById('nome').value.trim();
        const login = document.getElementById('login').value.trim();
        const msgBox = document.getElementById('mensagem-sistema');

        // Na demonstração, podemos simular que o login "admin" ou "operador" já existem
        if (login === 'admin' || login === 'operador') {
            msgBox.innerHTML = `Erro: O login '<strong>${login}</strong>' já existe no sistema!`;
            msgBox.className = "mensagem erro";
            msgBox.style.display = "block";
        } else {
            // Sucesso
            msgBox.innerHTML = `Usuário <strong>${nome}</strong> cadastrado com sucesso!`;
            msgBox.className = "mensagem sucesso";
            msgBox.style.display = "block";
            
            // Limpa o formulário
            document.getElementById('form-cadastro').reset();
        }

        // Esconde a mensagem após 5 segundos
        setTimeout(() => { msgBox.style.display = 'none'; }, 5000);
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.error('SW Error:', err));
    }
</script>
</body>
</html>
