<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fechamento Mensal - HP Terraplenagem</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
</head>
<body>
    <div class="container dashboard-container">
        <div class="header-painel">
            <h2>Fechamento Mensal da Frota</h2>
            <a href="painel.html" class="btn-sair">Voltar ao Painel</a>
        </div>

        <div id="mensagem-sistema" style="display: none;" class="mensagem"></div>

        <!-- Card da IA (Escondido por padrão) -->
        <div id="ia-feedback-container" style="display: none;" class="ia-feedback-card">
            <h4>💡 Análise do Assistente de Fechamento (Gemini)</h4>
            <p id="ia-texto-diagnostico"></p>
        </div>

        <div class="form-cadastro">
            <h3>Consolidar Período</h3>
            <form id="form-fechamento">
                <div class="form-grid">
                    <div>
                        <label for="mes">Mês de Referência:</label>
                        <select id="mes" name="mes" required class="input-select">
                            <!-- Preenchido via JS -->
                        </select>
                    </div>
                    <div>
                        <label for="ano">Ano de Referência:</label>
                        <input id="ano" type="number" name="ano" value="2026" required>
                    </div>
                </div>

                <button type="submit" id="btn-consolidar" class="btn-salvar btn-fechamento">Consolidar Dados</button>
            </form>
        </div>

        <hr class="divisor">

        <h3>Histórico de Fechamentos</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Período</th>
                        <th>Total de Horas</th>
                        <th>Total de Gastos</th>
                        <th>Responsável</th>
                    </tr>
                </thead>
                <tbody id="tabela-historico">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
        </div>
    </div>

<script>
    // 1. Segurança mockada
    if (!sessionStorage.getItem('id_usuario') || sessionStorage.getItem('tipo_usuario') !== 'admin') {
        window.location.href = 'index.html';
    }

    const nomeResponsavel = sessionStorage.getItem('nome_usuario') || 'Administrador';

    // 2. Preenche os meses e seleciona o atual
    const mesSelect = document.getElementById('mes');
    const mesAtual = new Date().getMonth() + 1;
    for (let i = 1; i <= 12; i++) {
        let m = String(i).padStart(2, '0');
        mesSelect.innerHTML += `<option value="${m}" ${i === mesAtual ? 'selected' : ''}>${m}</option>`;
    }

    // 3. Banco de Dados Simulado do Histórico
    let historicoFechamentos = [
        { mes: '09', ano: '2026', total_horas: 345.5, total_gastos: 8450.00, responsavel: 'Administrador' },
        { mes: '08', ano: '2026', total_horas: 412.0, total_gastos: 12100.50, responsavel: 'Administrador' }
    ];

    // 4. Renderizar Tabela
    function formatarMoeda(valor) {
        return valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderizarHistorico() {
        const tbody = document.getElementById('tabela-historico');
        tbody.innerHTML = '';

        if (historicoFechamentos.length === 0) {
            tbody.innerHTML = `<tr class="text-center"><td colspan="4" style="color: #64748b;">Nenhum fechamento realizado até o momento.</td></tr>`;
            return;
        }

        // Ordena do mais recente para o mais antigo
        const ordenado = [...historicoFechamentos].sort((a, b) => {
            if (a.ano !== b.ano) return b.ano - a.ano;
            return b.mes - a.mes;
        });

        ordenado.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${item.mes}/${item.ano}</strong></td>
                    <td>${item.total_horas.toFixed(2).replace('.', ',')}h</td>
                    <td>R$ ${formatarMoeda(item.total_gastos)}</td>
                    <td>${item.responsavel}</td>
                </tr>
            `;
        });
    }

    // 5. Simular a consolidação e a resposta da IA Gemini
    document.getElementById('form-fechamento').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const mes = document.getElementById('mes').value;
        const ano = document.getElementById('ano').value;
        const btn = document.getElementById('btn-consolidar');
        const msgBox = document.getElementById('mensagem-sistema');
        const iaCard = document.getElementById('ia-feedback-container');
        
        // Verifica se já fechou esse mês
        const jaExiste = historicoFechamentos.find(f => f.mes === mes && f.ano === ano);
        if (jaExiste) {
            msgBox.textContent = `Erro: O período de ${mes}/${ano} já foi fechado!`;
            msgBox.className = "mensagem erro";
            msgBox.style.display = "block";
            iaCard.style.display = "none";
            return;
        }

        // Simula processamento visualmente
        btn.textContent = "Analisando com IA...";
        btn.disabled = true;
        btn.style.backgroundColor = "#0ea5e9"; // Muda a cor para azul
        btn.style.borderColor = "#0ea5e9";
        msgBox.style.display = "none";
        iaCard.style.display = "none";

        // Simula o tempo de resposta do servidor/API do Gemini (2 segundos)
        setTimeout(() => {
            // Gera valores fictícios baseados no mês escolhido para parecer real
            const horasMockadas = (Math.random() * (450 - 200) + 200);
            const gastosMockados = (Math.random() * (15000 - 5000) + 5000);

            // Adiciona no histórico
            historicoFechamentos.push({
                mes: mes,
                ano: ano,
                total_horas: horasMockadas,
                total_gastos: gastosMockados,
                responsavel: nomeResponsavel
            });

            // Resposta fictícia simulando a IA do Gemini
            const diagnosticoMock = `Com base no fechamento de ${mes}/${ano}, a HP Terraplenagem registrou um total de ${horasMockadas.toFixed(0)} horas operacionais e R$ ${formatarMoeda(gastosMockados)} em despesas.\n\nObserva-se uma proporção saudável entre horas trabalhadas e custos de manutenção/combustível neste ciclo. Sugiro manter o acompanhamento preventivo das máquinas mais exigidas para evitar picos de gastos no próximo mês.`;

            // Atualiza interface
            document.getElementById('ia-texto-diagnostico').innerHTML = diagnosticoMock.replace(/\n/g, '<br>');
            iaCard.style.display = "block";

            msgBox.textContent = `Fechamento consolidado! Total: ${horasMockadas.toFixed(2).replace('.', ',')}h | Gastos: R$ ${formatarMoeda(gastosMockados)}`;
            msgBox.className = "mensagem sucesso";
            msgBox.style.display = "block";

            renderizarHistorico();

            // Restaura o botão
            btn.textContent = "Consolidar Dados";
            btn.disabled = false;
            btn.style.backgroundColor = "";
            btn.style.borderColor = "";

        }, 2000);
    });

    // Inicia a tabela
    renderizarHistorico();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(console.error);
    }
</script>
</body>
</html>
