<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Painel - HP Terraplenagem</title>
    <meta name="theme-color" content="#f59e0b">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <div class="header-painel">
            <h3 id="saudacao-usuario" style="margin: 0; text-align: left; font-size: 1.1rem; color: var(--text-dark);">Olá!</h3>
            <button id="btn-logout" class="btn-sair">Sair</button>
        </div>

        <!-- ================= VISÃO DO ADMINISTRADOR ================= -->
        <div id="view-admin" style="display: none;">
            <h2>Painel Gerencial</h2>
            
            <!-- Alertas de Manutenção Simulados -->
            <div class="card-alertas">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                    <div id="titulo-alerta" style="flex: 1; min-width: 200px;">
                        <h3 style="margin: 0; color: var(--text-dark); text-align: left; font-size: 1.1rem;">Controle de Manutenção</h3>
                        <p style="margin: 5px 0 0 0; font-size: 0.85rem; color: var(--text-main);">Acompanhamento de horímetro e troca de óleo.</p>
                    </div>
                    <a href="tela_manutencao.html" class="btn-manutencao" style="width: auto;">Acessar Manutenção</a>
                </div>
                
                <div id="alertas-container" style="margin-top: 20px; background: var(--primary-light); border-left: 4px solid var(--primary); padding: 15px; border-radius: var(--radius-sm);">
                    <strong style="color: #b45309; font-size: 0.9rem;">Atenção! Máquinas necessitando de revisão:</strong>
                    <ul id="lista-manutencao" style="margin: 10px 0 0 0; padding-left: 20px; color: #92400e; font-size: 0.9rem;">
                        <!-- Injetado via JS -->
                    </ul>
                </div>
            </div>

            <!-- Área de Botões (Deve ficar no final do container para o efeito de fundo escuro funcionar perfeitamente) -->
            <div class="admin-area">
                <a href="dashboard_horas.html"><button type="button" class="btn-excel">Gerenciamento de Horas</button></a>
                <a href="controle_gastos.html"><button type="button" class="btn-excel">Controle de Gastos</button></a>
                <a href="relatorios.html"><button type="button" class="btn-excel">Planilha de Relatórios</button></a>
                <a href="documentos.html"><button type="button" class="btn-excel">Documentos de Veículos</button></a>
                
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 25px 0;">
                
                <a href="fechamento.html"><button type="button" class="btn-fechamento">Fechamento Mensal</button></a>
                <a href="cadastro.html"><button type="button" class="btn-login" style="margin-top: 10px;">Cadastrar Novo Usuário</button></a>
            </div>
        </div>

        <!-- ================= VISÃO DO OPERADOR ================= -->
        <div id="view-operador" style="display: none;">
            <h2>Apontamento</h2>
            
            <div id="servico">
                <h3>Último serviço</h3>
                <p>Máquina: <span id="ultima-maquina">Nenhum registro</span></p>
                <p>Serviço: <span id="ultimo-servico">-</span></p>
            </div>
            
            <div id="msg-operador" style="display: none;" class="mensagem"></div>

            <form id="form-apontamento" autocomplete="off">
                <div class="form-group">
                    <label>Máquina:</label>
                    <select name="maquina" id="maquina" required class="input-select">
                        <option value="" disabled selected>Selecione uma máquina</option>
                        <option value="Retro John Deere">Retro John Deere</option>
                        <option value="Retro JCB">Retro JCB</option>
                        <option value="Escavadeira">Escavadeira</option>
                        <option value="Pá Carregadeira Liugong">Pá Carregadeira</option> 
                        <option value="Caminhão Caçamba">Caminhão Caçamba</option>
                        <option value="Caminhão Prancha">Caminhão Prancha</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Serviço / Cliente:</label>
                    <input type="text" name="servico" id="servico-input" placeholder="Ex: Limpeza de terreno" required>
                </div>

                <!-- Campos lado a lado usando grid/flex para um visual mais compacto -->
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Horímetro Inicial:</label>
                        <input type="number" step="0.01" name="h_inicial" id="h_inicial" placeholder="0000.00" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Horímetro Final:</label>
                        <input type="number" step="0.01" name="h_final" id="h_final" placeholder="0000.00" required>
                    </div>
                </div>

                <button type="submit" class="btn-salvar">Salvar Registro</button>
            </form>
        </div>

    </div>

    <!-- Script do Chat flutuante -->
    <script src="chat.js"></script>

<script>
    // 1. Verificação de Segurança (Mock) com Tratamento de Erro
    const idUsuario = sessionStorage.getItem('id_usuario');
    const tipoUsuario = sessionStorage.getItem('tipo_usuario');
    const nomeUsuario = sessionStorage.getItem('nome_usuario');

    if (!idUsuario) {
        window.location.replace('index.html');
    } else {
        const primeiroNome = nomeUsuario ? nomeUsuario.split(' ')[0] : 'Usuário';
        document.getElementById('saudacao-usuario').textContent = `Olá, ${primeiroNome}!`;

        // 2. Lógica de Logout
        document.getElementById('btn-logout').addEventListener('click', function() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        });

        // 3. Controle de Exibição (Admin vs Operador)
        if (tipoUsuario === 'admin') {
            document.getElementById('view-admin').style.display = 'block';
            
            // Simulação de alertas de manutenção
            const maquinasPendentes = [
                { nome: 'Pá Carregadeira Liugong', status: 'ATENÇÃO', restantes: 15.5 },
                { nome: 'Retroescavadeira JCB', status: 'CRITICO', restantes: -5.2 }
            ];
            
            const lista = document.getElementById('lista-manutencao');
            if (lista) {
                maquinasPendentes.forEach(maq => {
                    const li = document.createElement('li');
                    if(maq.status === 'CRITICO') {
                        li.innerHTML = `<strong>${maq.nome}</strong> - <span style="color:#ef4444;">Vencida!</span>`;
                    } else {
                        li.innerHTML = `<strong>${maq.nome}</strong> - Restam apenas ${maq.restantes.toFixed(2).replace('.', ',')}h`;
                    }
                    lista.appendChild(li);
                });
            }

        } else {
            document.getElementById('view-operador').style.display = 'block';

            // 4. Lógica de Apontamento do Operador
            const formApontamento = document.getElementById('form-apontamento');
            if (formApontamento) {
                formApontamento.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const maquina = document.getElementById('maquina').value;
                    const servico = document.getElementById('servico-input').value;
                    const h_inicial = parseFloat(document.getElementById('h_inicial').value);
                    const h_final = parseFloat(document.getElementById('h_final').value);
                    const msgBox = document.getElementById('msg-operador');

                    if (h_final < h_inicial) {
                        msgBox.textContent = "ERRO: Hora final não pode ser menor que a inicial!";
                        msgBox.className = "mensagem erro";
                        msgBox.style.display = "block";
                    } else {
                        const total = (h_final - h_inicial).toFixed(2);
                        msgBox.textContent = `Dados enviados! Total trabalhado: ${total} hora(s).`;
                        msgBox.className = "mensagem sucesso";
                        msgBox.style.display = "block";
                        
                        // Atualiza o painel de "Último Serviço"
                        document.getElementById('ultima-maquina').textContent = maquina;
                        document.getElementById('ultimo-servico').textContent = servico;
                        
                        // Limpa o formulário
                        formApontamento.reset();
                    }
                    
                    setTimeout(() => { msgBox.style.display = 'none'; }, 5000);
                });
            }
        }
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }
</script>
</body>
</html>
